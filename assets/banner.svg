<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="16" fill="url(#bg)" />
  
  <!-- Dynamic Animated Background Elements -->
  <g opacity="0.25">
    <!-- Pulsing supply chain nodes -->
    <circle cx="100" cy="170" r="30" fill="none" stroke="#ec4899" stroke-width="2">
      <animate attributeName="r" values="20;40;20" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="50" r="45" fill="none" stroke="#3b82f6" stroke-width="2">
      <animate attributeName="r" values="35;55;35" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="6s" repeatCount="indefinite" />
    </circle>
    <!-- Moving supply chain wave -->
    <path d="M-50,160 Q 200,60 400,160 T 850,60" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="10s" repeatCount="indefinite" />
    </path>
    <!-- Floating tech pills in background (kept low opacity so foreground text shines) -->
    <rect x="620" y="140" width="110" height="30" rx="15" fill="#8b5cf6" opacity="0.4">
      <animate attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="5s" repeatCount="indefinite" />
    </rect>
    <rect x="80" y="40" width="90" height="26" rx="13" fill="#ec4899" opacity="0.4">
      <animate attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="400" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="1" filter="url(#glow)">
      Awesome Fashion Sourcing Management
    </text>
    
    <!-- Decorative Line -->
    <rect x="250" y="112" width="300" height="4" rx="2" fill="url(#accent)" />

    <!-- Subtitle -->
    <text x="400" y="148" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" letter-spacing="0.5">
      👔 Curated Ecosystem of Apparel Sourcing, Supply Chain &amp; Compliance Platforms 🧵
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 168)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="110" height="24" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
        <text x="55" y="16" fill="#f472b6" text-anchor="middle">SaaS Platforms</text>
      </g>
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="120" height="24" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="60" y="16" fill="#a78bfa" text-anchor="middle">Open Source ERP</text>
      </g>
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="110" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="55" y="16" fill="#60a5fa" text-anchor="middle">Traceability</text>
      </g>
    </g>
  </g>
</svg>
